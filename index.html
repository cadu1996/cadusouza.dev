<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadu Souza</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #30363d;
      margin: 0 auto 1.5rem;
      display: block;
      background: #161b22;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f0f6fc;
    }

    .tagline {
      font-size: 1.05rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.95rem;
      background: #161b22;
      transition: border-color 0.2s, background 0.2s;
    }

    .links a:hover {
      border-color: #58a6ff;
      background: #1c2128;
    }
  </style>
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="https://github.com/cadu1996.png"
      alt="Foto de Cadu Souza"
    />
    <h1>Cadu Souza</h1>
    <p class="tagline">Software Developer</p>
    <nav class="links">
      <a href="https://github.com/cadu1996" target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
      <a href="https://linkedin.com/in/cadusouza" target="_blank" rel="noopener noreferrer">
        LinkedIn
      </a>
    </nav>
  </main>
</body>
</html>
